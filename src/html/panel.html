<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Escuela San Martín</title>
  <link rel="stylesheet" href="../src/styles/stylePan.css">
</head>
<body>
  <header>
    <div class="contenedor-header">
      <nav class="botones">
        <a href="/">INICIO</a>
        <a href="/especialidades">ESPECIALIDADES</a>
        <a href="#contacto">CONTACTO</a>
        <a href="/panel">PANEL</a>
      </nav>
      <div class="logueo">
        <a href="/register" id="reg">REGISTRARSE</a>
        <a href="/login" id="log">LOGIN</a>
      </div>
    </div>
  </header>

  <section class="panel">
    <div class="opciones">
      <button id="cuenta" type="button">MI CUENTA</button>
      <button id="asis" type="button">ASISTENCIAS</button>
      <button id="notas" type="button">NOTAS</button>
      <button id="cerrar-ses" type="button">Cerrar Sesion</button>
    </div>
    <div id="inicio" class="datos">
      <h2>Mi Cuenta</h2>
  
      <div class="fila-datos">
        <p>Nombre:</p>
        <span id="nombre"></span>
      </div>
      <div class="fila-datos">
        <p>Apellido:</p>
        <span id="apellido"></span>
      </div>
      <div class="fila-datos">
        <p>DNI:</p>
        <span id="dni"></span>
      </div>
      <div class="fila-datos">
        <p>Email:</p>
        <span id="mail"></span>
      </div>
      <div class="fila-datos">
        <p>Telefono:</p>
        <span id="telefono"></span>
      </div>
      <div class="fila-datos">
        <p>Año:</p>
        <span id="año"></span>
      </div>
      <div class="fila-datos">
        <p>Curso:</p>
        <span id="curso"></span>
      </div>
      <div class="fila-datos">
        <p>Turno:</p>
        <span id="turno"></span>
      </div>
      
    </div>
    
    <div id="asistencias" class="asist">
      <h2>hola soy las asistencias</h2>
    </div>

    <div id="notitas" class="notas">
      <h2>hola soy notitas uwu</h2>
    </div>
  </section>
  <script>
      document.querySelector("#nombre").innerText = "Juan";
      document.querySelector("#apellido").innerText = "Cetro";
      document.querySelector("#dni").innerText = "47806274";
      document.querySelector("#mail").innerText = "juancetroet32@gmail.com";
      document.querySelector("#telefono").innerText = "1131349152";
      document.querySelector("#año").innerText = "6to";
      document.querySelector("#curso").innerText = "2da";
      document.querySelector("#turno").innerText = "Vespertino";

      actualizarBotonesActivos("cuenta");

      document.querySelector("#cuenta").addEventListener("click", () => {
        document.querySelector(".datos").style.display= "flex";
        document.querySelector(".asist").style.display= "none";
        document.querySelector(".notas").style.display= "none";
        actualizarBotonesActivos("cuenta");
      });

      document.querySelector("#asis").addEventListener("click", () => {
        document.querySelector(".datos").style.display= "none";
        document.querySelector(".notas").style.display= "none";
        document.querySelector(".asist").style.display= "block";
        actualizarBotonesActivos("asis");
      });

      document.querySelector("#notas").addEventListener("click", () => {
        document.querySelector(".notas").style.display= "block";
        document.querySelector(".asist").style.display= "none";
        document.querySelector(".datos").style.display= "none";
        actualizarBotonesActivos("notas");
      });
      
      function actualizarBotonesActivos(idActivo) {
        document.querySelectorAll("#cuenta, #asis, #notas").forEach(boton => {
          if (boton.id === idActivo) {
            boton.classList.add("activo");
          }else {
            boton.classList.remove("activo");
          }
        });
      }

  </script>
  <footer>
    <p>&copy; 2025 Escuela Secundaria San Martín. Todos los derechos reservados.</p>
  </footer>
</body>
</html>
